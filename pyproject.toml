[project]
name = "language_rewinder"
version = "0.1.0"
description = "Convert modern talk to historical language"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.74.0",
    "gradio==5.49.1",
    "pydantic<=2.12.5",
    "psutil<6",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "huggingface-hub>=1.13.0",
    "pytest>=8.3.0",
]
