[project]
name = "language_rewinder"
version = "0.1.0"
description = "Convert modern talk to historical language"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.74.0",
    "gradio>=6.15.0",
    "pydantic<=2.12.5",
    "psutil<6",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "huggingface-hub>=1.13.0",
    "pytest>=8.3.0",
]

[tool.uv]
override-dependencies = [
    "starlette>=1.3.1",
    "urllib3>=2.8.0",
    "pyasn1>=0.6.5",
    "python-multipart>=0.0.30",
    "pillow>=12.3.0,<13",
    "anyio>=4.14.2",
    "cryptography>=50.0.0",
    "brotli>=1.2.1",
    "certifi>=2026.10.18",
    "filelock>=4.2.1",
    "fsspec>=2026.6.0",
]
